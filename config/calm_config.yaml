baseline_checkpoint: null
model_name_or_path: PLACEHOLDER
tokenizer_path: null
model_type: calm
dataset: PLACEHOLDER
seed: 42
early_layer_idx: [6, 12, 18]
calm:
  threshold: 0.9
  confidence_measure: max_prob
  per_exit_norms: true
  loss_weighting: linear
  exit_loss_warmup_steps: 0
load_args:
  bf16: true
  fp16: false
  fp32: false
  attn_implementation: sdpa
compile:
  torch_compile: false
model_overrides:
  hidden_size: 768
  num_hidden_layers: 24
  num_attention_heads: 12
  num_key_value_heads: 12
  intermediate_size: 2184
  head_dim: 64
  max_position_embeddings: 1024
training_args:
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 4
  gradient_checkpointing: false
  gradient_checkpointing_kwargs:
    use_reentrant: false
  learning_rate: 5.0e-4
  min_lr: 5.0e-5
  max_steps: 17251
  num_train_epochs: 1
  optim: adamw_torch_fused
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-08
  lr_scheduler_type: cosine_with_min_lr
  warmup_ratio: 0.01
  max_grad_norm: 1.0
  weight_decay: 0.1
  bf16: true
  fp16: false
  fp32: false
  dataloader_num_workers: 8
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 4
  logging_steps: 5
  save_steps: 0
  eval_strategy: steps
  eval_steps: 0
  eval_save_interval_percent: 0.1
  report_to: wandb
  project_name: PLACEHOLDER
  run_name: PLACEHOLDER
hydra:
  job:
    chdir: true
  run:
    dir: PLACEHOLDER
  sweep:
    dir: PLACEHOLDER
    subdir: PLACEHOLDER
