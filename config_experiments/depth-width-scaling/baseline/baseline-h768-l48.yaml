model_name_or_path: PLACEHOLDER
model_type: baseline
seed: 42
dataset: PLACEHOLDER
early_layer_idx:
- 6
- 12
- 18
decode_head: final
temperature: 1.0
random_init_all: true
init_checkpoint: null
resume_from_checkpoint: null
tying:
  tie_final_to_embeddings: false
  tie_early_to_final: true
  tie_early_to_embeddings: false
  init_early_from: random
router:
  router_type: simple_mlp
  router_temp: 1.0
  hidden_size: 768
  intermediate_size: 512
  num_layers: 1
  router_head_init_std: 0.4
early_adapter:
  enabled: true
  dim: 768
final_adapter:
  enabled: true
  dim: 768
loss:
  use_warmup: true
  warmup_ratio: 0.05
  warmup_steps: 0
  warmup:
    mix_loss: true
    router_warmup_loss: true
    router_compute_loss: false
  main:
    mix_loss: true
    router_warmup_loss: false
    router_compute_loss: true
  alphas_warmup:
    mix_loss: 1.0
    router_warmup_loss: 1.0
    router_compute_loss: 0.15
  alphas_main:
    mix_loss: 1.0
    router_warmup_loss: 1.0
    router_compute_loss: 0.15
freeze_options:
  train_backbone: true
  train_lm_head: true
  train_early_lm_head: true
  train_early_norm: true
  train_router: true
  train_early_adapter: true
  train_final_adapter: true
  frozen_layers: []
  freeze_embeddings: false
load_args:
  bf16: true
  fp16: false
  fp32: false
  attn_implementation: sdpa
compile:
  torch_compile: false
model_overrides:
  hidden_size: 768
  num_hidden_layers: 48
  num_attention_heads: 12
  num_key_value_heads: 12
  intermediate_size: 2120
  head_dim: 64
  max_position_embeddings: 1024
training_args:
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 8
  gradient_checkpointing: false
  gradient_checkpointing_kwargs:
    use_reentrant: false
  learning_rate: 0.0004
  min_lr: 4.0e-05
  max_steps: 30278
  num_train_epochs: 1
  optim: adamw_torch_fused
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-08
  lr_scheduler_type: cosine_with_min_lr
  warmup_ratio: 0.01
  max_grad_norm: 1.0
  weight_decay: 0.1
  bf16: true
  fp16: false
  fp32: false
  dataloader_num_workers: 8
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 4
  logging_steps: 5
  save_steps: 0
  eval_strategy: steps
  eval_steps: 0
  eval_save_interval_percent: 0.05
  report_to: wandb
  project_name: PLACEHOLDER
  run_name: baseline_h768_l48
